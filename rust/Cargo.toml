[workspace]
resolver = "2"
members = [
  "ovca-types",
  "ovca-workflow",
]
default-members = [
  "ovca-types",
  "ovca-workflow",
]

[workspace.package]
authors = ["OVCA Contributors"]
edition = "2021"
license = "Apache-2.0"
publish = false
repository = "https://github.com/nattawatpuntachot52/ovca-reference"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
